<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poefire</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="flame" aria-hidden="true"></span>poefire</div>
    <label class="league">
      <span>League</span>
      <select id="league" aria-label="League"></select>
    </label>
    <div class="now" id="now" hidden title="Current run">
      <span class="live-dot" id="now-dot"></span>
      <span class="now-name" id="now-name"></span>
      <span class="now-timer" id="now-timer">00:00</span>
    </div>
    <div class="pills">
      <button class="pill" id="prices-pill" title="Refresh prices from poe.ninja">
        <span class="dot"></span><span id="prices-text">Prices…</span>
      </button>
      <button class="pill" id="loot-pill" title="Take a snapshot now">
        <span class="dot"></span><span id="loot-text">Loot…</span>
      </button>
    </div>
  </header>

  <main>
    <section class="card current" id="last">
      <div class="card-title">Last map</div>
      <div class="current-empty" id="last-empty">No map finished yet. Stats appear when you're back in your hideout.</div>
      <div id="last-body" hidden>
        <div class="current-head">
          <div>
            <div class="map-name" id="last-name"></div>
            <div class="map-meta" id="last-meta"></div>
          </div>
        </div>
        <div class="last-value" id="last-value"></div>
        <div class="current-stats">
          <div><span class="label">Time</span><span id="last-time"></span></div>
          <div><span class="label">Deaths</span><span id="last-deaths"></span></div>
          <div><span class="label">vs. avg map</span><span id="last-vs"></span></div>
        </div>
        <ul class="items top-drops" id="last-drops"></ul>
      </div>
    </section>

    <section class="card session">
      <div class="card-title">Session <span class="muted" id="session-since"></span></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card runs">
      <div class="card-title">Runs</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Started</th><th>Map</th><th class="num">Lvl</th><th class="num">Time</th>
              <th class="num">Deaths</th><th class="num">Chaos</th><th class="num">Divine</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
        <div class="empty" id="runs-empty" hidden>No runs recorded yet.</div>
      </div>
    </section>

    <section class="card detail">
      <div class="card-title" id="detail-title">Run loot</div>
      <div id="detail"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
