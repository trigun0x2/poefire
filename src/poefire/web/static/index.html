<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poefire</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="flame" aria-hidden="true"></span>poefire</div>
    <label class="league">
      <span>League</span>
      <select id="league" aria-label="League"></select>
    </label>
    <div class="pills">
      <button class="pill" id="prices-pill" title="Refresh prices from poe.ninja">
        <span class="dot"></span><span id="prices-text">Prices…</span>
      </button>
      <button class="pill" id="loot-pill" title="Take a snapshot now">
        <span class="dot"></span><span id="loot-text">Loot…</span>
      </button>
    </div>
  </header>

  <main>
    <section class="card current" id="current">
      <div class="card-title">Current run</div>
      <div class="current-empty" id="current-empty">No map yet. Enter a map to start the timer.</div>
      <div class="current-body" id="current-body" hidden>
        <div class="current-head">
          <div>
            <div class="map-name" id="cur-map"></div>
            <div class="map-meta" id="cur-meta"></div>
          </div>
          <span class="status" id="cur-status"></span>
        </div>
        <div class="timer" id="cur-timer">00:00</div>
        <div class="current-stats">
          <div><span class="label">Deaths</span><span id="cur-deaths">0</span></div>
          <div><span class="label">Loot</span><span id="cur-loot">—</span></div>
          <div><span class="label">Zone</span><span id="cur-zone">—</span></div>
        </div>
      </div>
      <div class="last-map" id="last-map" hidden>
        <div class="label">Last map</div>
        <div class="last-map-row">
          <span class="last-name" id="last-name"></span>
          <span id="last-time"></span>
          <span id="last-deaths"></span>
          <span class="last-loot" id="last-loot"></span>
        </div>
      </div>
    </section>

    <section class="card session">
      <div class="card-title">Session <span class="muted" id="session-since"></span></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card runs">
      <div class="card-title">Runs</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Started</th><th>Map</th><th class="num">Lvl</th><th class="num">Time</th>
              <th class="num">Deaths</th><th class="num">Chaos</th><th class="num">Divine</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
        <div class="empty" id="runs-empty" hidden>No runs recorded yet.</div>
      </div>
    </section>

    <section class="card detail">
      <div class="card-title" id="detail-title">Run loot</div>
      <div id="detail"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
