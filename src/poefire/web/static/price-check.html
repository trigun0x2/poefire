<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poefire price check</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/price-check.css">
</head>
<body class="pc">
  <header class="pc-head pywebview-drag-region">
    <div class="pc-title pywebview-drag-region">
      <div id="pc-name" class="pc-name">Price check</div>
      <div id="pc-sub" class="pc-sub muted"></div>
    </div>
    <button type="button" class="win-btn" id="pc-close" title="Close (Esc)" aria-label="Close">
      <svg viewBox="0 0 10 10"><path d="M0 0L10 10M10 0L0 10"/></svg>
    </button>
  </header>
  <main class="pc-body">
    <div id="pc-empty" class="pc-empty muted">Hover an item in the game and press your price check key (Ctrl+D).</div>

    <section id="pc-bulk" hidden>
      <div class="pc-big" id="pc-bulk-price"></div>
      <div class="hint" id="pc-bulk-note"></div>
    </section>

    <form id="pc-form" hidden>
      <div id="pc-filters" class="pc-filters"></div>
      <div id="pc-unmatched" class="pc-unmatched muted"></div>
      <div class="pc-actions">
        <button type="submit" class="btn primary" id="pc-search">Search</button>
        <span id="pc-status" class="hint"></span>
      </div>
    </form>

    <section id="pc-results" hidden>
      <div class="pc-avg" id="pc-avg"></div>
      <table class="pc-list"><tbody id="pc-rows"></tbody></table>
      <a id="pc-link" class="pc-link" target="_blank" rel="noopener" hidden>Open this search on the trade site ↗</a>
    </section>
  </main>
  <script src="/static/core.js"></script>
  <script src="/static/price-check.js"></script>
</body>
</html>
