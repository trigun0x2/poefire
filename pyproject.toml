[project]
name = "poefire"
version = "0.1.0"
description = "ToS-safe Path of Exile farming tracker (Client.txt + official API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
poefire = "poefire.cli:main"

[project.optional-dependencies]
window = [
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poefire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette's TestClient prefers the new `httpx2` package; the `httpx` fallback works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
