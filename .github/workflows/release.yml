name: Windows release

# Public releases come from `master`: every push there publishes v<major>.<minor+1>.0, counting
# from the latest public tag, marked as GitHub's "latest" release. The app's auto-updater installs
# these. To pick a version by hand (a patch release, or 1.0), set __version__ in
# src/poefire/__init__.py higher than that; it is used when it's the higher one.
#
# Pushes to `dev` replace the one rolling pre-release, tagged `beta` (its zip is named after the
# build's version, v<next>-dev.<run number>), so the Releases page shows a single beta entry.
# Only users on the beta update channel get it.
#
# Running the workflow manually (Actions > Windows release > Run workflow) only builds the app
# as a workflow artifact, versioned <next>-dev.<run number>; on dev with "publish beta" ticked
# it replaces the beta like a push does (the PoB tree workflow uses that: its own commits
# can't trigger a push run).
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:
    inputs:
      publish_beta:
        description: "On dev: publish this build as the beta"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    name: Build Windows x64
    # pushes to other branches are covered by CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'master' ||
      github.ref_name == 'dev'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
      channel: ${{ steps.version.outputs.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the latest version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install (with the native window extra)
        run: uv sync --locked --extra window

      - name: Version
        id: version
        env:
          PUBLISH_BETA: ${{ inputs.publish_beta }}
        run: |
          # latest *public* release tag (pre-releases have a "-dev." suffix)
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          code=$(uv run python -c "import poefire; print(poefire.__version__)")
          if [[ -z "$latest" ]]; then
            next="$code"
          else
            # by default the minor version goes up; the major version never changes on its own
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="$major.$((minor + 1)).0"
            # a higher version set in src/poefire/__init__.py wins (to pick a version by hand)
            if [[ "$code" != "$next" && "$(printf '%s\n%s\n' "$next" "$code" | sort -V | tail -n 1)" == "$code" ]]; then
              next="$code"
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "master" ]]; then
            channel=public
            version="$next"
          elif [[ "$GITHUB_REF_NAME" == "dev" && ( "$GITHUB_EVENT_NAME" == "push" || "$PUBLISH_BETA" == "true" ) ]]; then
            channel=prerelease
            version="$next-dev.$GITHUB_RUN_NUMBER"
          else
            channel=none
            version="$next-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "latest public tag: ${latest:-none}, building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "artifact=poefire-$version-windows-x64" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        run: |
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.version }}\"/" src/poefire/__init__.py
          uv run python -c "import poefire; print(poefire.__version__)"

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv run --with "pyinstaller==$PYINSTALLER_VERSION" pyinstaller packaging/windows/poefire.spec --noconfirm --clean

      - name: Smoke test the build
        run: |
          ls dist/poefire/poefire.exe dist/poefire/poefire-cli.exe
          ./dist/poefire/poefire-cli.exe --help
          ./dist/poefire/poefire-cli.exe ui --no-browser --port 8460 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8460/ -o page.html && break
            sleep 1
          done
          grep -q "<title>poefire</title>" page.html
          curl -fsS -o /dev/null http://127.0.0.1:8460/static/main.js
          curl -fsS http://127.0.0.1:8460/api/status
          taskkill //F //IM poefire-cli.exe

      - name: Smoke test the update signature check (sigstore packaged, real attestation)
        run: |
          ./dist/poefire/poefire-cli.exe verify poefire-0.21.0-dev.88-windows-x64.zip --beta --offline \
            --bundle tests/data/poefire-0.21.0-dev.88-windows-x64.zip.sigstore.json \
            --sha256 17a703dce83784b6ff87b6f7683a34aea906b9543203e70b4d4d6d8078884772
          # a beta build must not pass as a public release
          ! ./dist/poefire/poefire-cli.exe verify poefire-0.21.0-dev.88-windows-x64.zip --offline \
            --bundle tests/data/poefire-0.21.0-dev.88-windows-x64.zip.sigstore.json \
            --sha256 17a703dce83784b6ff87b6f7683a34aea906b9543203e70b4d4d6d8078884772

      - name: Smoke test the native window (DLLs marked as downloaded, like an extracted zip)
        shell: pwsh
        timeout-minutes: 5
        run: |
          Get-ChildItem dist/poefire -Recurse -Filter *.dll | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $env:APPDATA = "$PWD\appdata"
          # the console build prints to stdout; the windowed poefire.exe runs in the next step
          $p = Start-Process dist/poefire/poefire-cli.exe -ArgumentList "ui","--window","--port","8461" `
            -RedirectStandardOutput win.out -RedirectStandardError win.err -PassThru
          Start-Sleep -Seconds 20
          Get-Content win.out, win.err
          $failed = Select-String -Path win.out, win.err -Pattern "native window failed|Traceback" -Quiet
          $exited = $p.HasExited
          Invoke-WebRequest http://127.0.0.1:8461/ -UseBasicParsing | Out-Null
          $marked = Get-Item dist/poefire/_internal/pythonnet/runtime/Python.Runtime.dll -Stream * |
            Where-Object Stream -eq "Zone.Identifier"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($failed -or $exited) { Write-Error "native window did not start"; exit 1 }
          if ($marked) { Write-Error "Zone.Identifier was not removed"; exit 1 }

      - name: Smoke test the self-update (packaged apply-update)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:APPDATA = "$PWD\appdata-upd"
          Copy-Item dist/poefire installed -Recurse
          Copy-Item dist/poefire staged -Recurse
          Set-Content staged/_internal/marker.txt "new version"
          $old = Start-Process ping -ArgumentList "-n","5","127.0.0.1" -WindowStyle Hidden -PassThru
          # not -Wait: that also waits for the app apply-update restarts, which keeps running
          $p = Start-Process staged/poefire.exe -PassThru -ArgumentList `
            "apply-update","--source","$PWD\staged","--target","$PWD\installed","--pid",$old.Id,"--log","$PWD\update.log"
          if (-not $p.WaitForExit(120000)) { Write-Error "apply-update did not finish"; exit 1 }
          Get-Content update.log
          Start-Sleep -Seconds 3
          # the updated app restarts as poefire.exe
          $restarted = Get-Process poefire -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -eq "$PWD\installed\poefire.exe" }
          Get-Process poefire -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($p.ExitCode -ne 0) { Write-Error "apply-update exited with $($p.ExitCode)"; exit 1 }
          if (-not $restarted) { Write-Error "the updated app was not restarted"; exit 1 }
          if (-not $old.HasExited) { Write-Error "did not wait for the old process"; exit 1 }
          if (-not (Test-Path installed/_internal/marker.txt)) { Write-Error "files were not copied"; exit 1 }
          if (-not (Select-String -Path update.log -Pattern "update applied" -Quiet)) { Write-Error "no log"; exit 1 }

      # GitHub zips every artifact itself, so upload the app folder as is (not a zip): the
      # artifact download is then one zip with the app inside. The release zip is made from
      # these same files in the next job.
      - name: Add the README and license
        run: cp README.md LICENSE dist/poefire/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/poefire/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.channel != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # to sign the build attestation (Sigstore, keyless)
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NAME: ${{ needs.build.outputs.artifact }}
      CHANNEL: ${{ needs.build.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the last release, for the notes
          path: repo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: app

      - name: Release notes (what's new since the last public release)
        run: |
          (cd repo && python3 scripts/release_notes.py --head "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY") > notes.md
          cat notes.md

      - name: Zip (app files at the top level, no nested folder)
        run: |
          (cd app && zip -qr -9 "../$NAME.zip" .)
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          unzip -l "$NAME.zip" | head -n 12

      # Signed proof that this zip was built by this workflow from this commit, in public CI.
      # Anyone can check it: gh attestation verify <zip> --repo trigun0x2/poefire. The app's
      # updater checks the same bundle (the .sigstore.json asset) before installing an update.
      - name: Attest the build
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.NAME }}.zip
      - name: Keep the attestation next to the zip
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$NAME.zip.sigstore.json"
          # the signed SLSA provenance on its own (a DSSE envelope), in the usual .intoto.jsonl form
          jq -c .dsseEnvelope "$BUNDLE" > "$NAME.intoto.jsonl"

      # Optional: with a VT_API_KEY secret (a free VirusTotal account), the zip is uploaded for a
      # scan. The report link (by the zip's sha256) goes in the notes either way.
      - name: VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          sha=$(cut -d" " -f1 "$NAME.zip.sha256")
          if [[ -n "$VT_API_KEY" ]]; then
            url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
            curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@$NAME.zip" "$url" > /dev/null && echo "uploaded to VirusTotal"
          fi
          {
            echo
            echo "Verify this download:"
            echo "- SHA-256: \`$sha\`"
            echo "- Built by GitHub Actions from this commit: \`gh attestation verify $NAME.zip --repo $GITHUB_REPOSITORY\`"
            if [[ -n "$VT_API_KEY" ]]; then echo "- VirusTotal scan: https://www.virustotal.com/gui/file/$sha"; fi
          } >> notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHANNEL" == "public" ]]; then
            gh release create "v$VERSION" "$NAME.zip" "$NAME.zip.sha256" "$NAME.zip.sigstore.json" "$NAME.intoto.jsonl" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest --title "poefire v$VERSION" --notes-file notes.md
          else
            # one rolling beta: replace the previous one (release and tag)
            gh release delete beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create beta "$NAME.zip" "$NAME.zip.sha256" "$NAME.zip.sigstore.json" "$NAME.intoto.jsonl" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "poefire beta (v$VERSION)" \
              --notes "$(printf 'Latest development build from `%s` (%s), version %s. Replaced on every push to `%s`; only installed by the beta update channel.\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$VERSION" "$GITHUB_REF_NAME"; cat notes.md)"
          fi

      - name: Remove older per-build pre-releases
        if: needs.build.outputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and .tagName != "beta") | .tagName' |
          while read -r tag; do
            echo "deleting old pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
