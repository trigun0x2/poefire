name: Windows release

# Public releases come from `master`: every push there publishes v<major>.<minor+1>.0, counting
# from the latest public tag (the first one uses __version__ from the code), marked as GitHub's
# "latest" release. The app's auto-updater installs these.
#
# Pushes to `dev` publish pre-releases (v<next>-dev.<run number>), which only reach users on
# the beta update channel. Only the 10 newest pre-releases are kept.
#
# Running the workflow manually (Actions > Windows release > Run workflow) only builds the app
# as a workflow artifact, versioned <next>-dev.<run number>.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    name: Build Windows x64
    # pushes to other branches are covered by CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'master' ||
      github.ref_name == 'dev'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
      channel: ${{ steps.version.outputs.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the latest version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install (with the native window extra)
        run: uv sync --locked --extra window

      - name: Version
        id: version
        run: |
          # latest *public* release tag (pre-releases have a "-dev." suffix)
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          if [[ -z "$latest" ]]; then
            next=$(uv run python -c "import poefire; print(poefire.__version__)")
          else
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="$major.$((minor + 1)).0"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "master" ]]; then
            channel=public
            version="$next"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "dev" ]]; then
            channel=prerelease
            version="$next-dev.$GITHUB_RUN_NUMBER"
          else
            channel=none
            version="$next-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "latest public tag: ${latest:-none}, building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "artifact=poefire-$version-windows-x64" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        run: |
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.version }}\"/" src/poefire/__init__.py
          uv run python -c "import poefire; print(poefire.__version__)"

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv run --with "pyinstaller==$PYINSTALLER_VERSION" pyinstaller packaging/windows/poefire.spec --noconfirm --clean

      - name: Smoke test the build
        run: |
          ./dist/poefire/poefire.exe --help
          ./dist/poefire/poefire.exe ui --no-browser --port 8460 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8460/ -o page.html && break
            sleep 1
          done
          grep -q "<title>poefire</title>" page.html
          curl -fsS -o /dev/null http://127.0.0.1:8460/static/app.js
          curl -fsS http://127.0.0.1:8460/api/status
          taskkill //F //IM poefire.exe

      - name: Smoke test the native window (DLLs marked as downloaded, like an extracted zip)
        shell: pwsh
        run: |
          Get-ChildItem dist/poefire -Recurse -Filter *.dll | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $env:APPDATA = "$PWD\appdata"
          $p = Start-Process dist/poefire/poefire.exe -ArgumentList "ui","--window","--port","8461" `
            -RedirectStandardOutput win.out -RedirectStandardError win.err -PassThru
          Start-Sleep -Seconds 20
          Get-Content win.out, win.err
          $failed = Select-String -Path win.out, win.err -Pattern "native window failed|Traceback" -Quiet
          $exited = $p.HasExited
          Invoke-WebRequest http://127.0.0.1:8461/ -UseBasicParsing | Out-Null
          $marked = Get-Item dist/poefire/_internal/pythonnet/runtime/Python.Runtime.dll -Stream * |
            Where-Object Stream -eq "Zone.Identifier"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($failed -or $exited) { Write-Error "native window did not start"; exit 1 }
          if ($marked) { Write-Error "Zone.Identifier was not removed"; exit 1 }

      # GitHub zips every artifact itself, so upload the app folder as is (not a zip): the
      # artifact download is then one zip with the app inside. The release zip is made from
      # these same files in the next job.
      - name: Add the README
        run: cp README.md dist/poefire/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/poefire/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.channel != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NAME: ${{ needs.build.outputs.artifact }}
      CHANNEL: ${{ needs.build.outputs.channel }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: app

      - name: Zip (app files at the top level, no nested folder)
        run: |
          (cd app && zip -qr -9 "../$NAME.zip" .)
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          unzip -l "$NAME.zip" | head -n 12

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHANNEL" == "public" ]]; then
            flags=(--latest --title "poefire v$VERSION" --generate-notes)
          else
            flags=(--prerelease --latest=false --title "poefire v$VERSION (pre-release)"
                   --notes "Development build from \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Only installed by the beta update channel.")
          fi
          gh release create "v$VERSION" "$NAME.zip" "$NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            "${flags[@]}"

      - name: Keep only the 10 newest pre-releases
        if: needs.build.outputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            echo "deleting old pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
