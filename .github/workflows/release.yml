name: Windows release

# Push a tag like v0.2.0 (matching __version__ in src/poefire/__init__.py) to build and publish
# a release. Run it manually (Actions > Windows release > Run workflow) to only build the zip
# as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install (with the native window extra)
        run: uv sync --locked --extra window

      - name: Version
        id: version
        run: |
          version=$(uv run python -c "import poefire; print(poefire.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match poefire.__version__ ($version)"
            exit 1
          fi

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv run --with "pyinstaller==$PYINSTALLER_VERSION" pyinstaller packaging/windows/poefire.spec --noconfirm --clean

      - name: Smoke test the build
        run: |
          ./dist/poefire/poefire.exe --help
          ./dist/poefire/poefire.exe ui --no-browser --port 8460 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8460/ -o page.html && break
            sleep 1
          done
          grep -q "<title>poefire</title>" page.html
          curl -fsS -o /dev/null http://127.0.0.1:8460/static/app.js
          curl -fsS http://127.0.0.1:8460/api/status
          taskkill //F //IM poefire.exe

      - name: Smoke test the native window (DLLs marked as downloaded, like an extracted zip)
        shell: pwsh
        run: |
          Get-ChildItem dist/poefire -Recurse -Filter *.dll | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $env:APPDATA = "$PWD\appdata"
          $p = Start-Process dist/poefire/poefire.exe -ArgumentList "ui","--window","--port","8461" `
            -RedirectStandardOutput win.out -RedirectStandardError win.err -PassThru
          Start-Sleep -Seconds 20
          Get-Content win.out, win.err
          $failed = Select-String -Path win.out, win.err -Pattern "native window failed|Traceback" -Quiet
          $exited = $p.HasExited
          Invoke-WebRequest http://127.0.0.1:8461/ -UseBasicParsing | Out-Null
          $marked = Get-Item dist/poefire/_internal/pythonnet/runtime/Python.Runtime.dll -Stream * |
            Where-Object Stream -eq "Zone.Identifier"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($failed -or $exited) { Write-Error "native window did not start"; exit 1 }
          if ($marked) { Write-Error "Zone.Identifier was not removed"; exit 1 }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $name = "poefire-${{ steps.version.outputs.version }}-windows-x64"
          Copy-Item README.md dist/poefire/
          Compress-Archive -Path dist/poefire -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            ${{ steps.zip.outputs.name }}.zip
            ${{ steps.zip.outputs.name }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "poefire $GITHUB_REF_NAME" \
            --generate-notes
