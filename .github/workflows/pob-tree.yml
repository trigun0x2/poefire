name: PoB tree data

# Keeps src/poefire/pob_tree.py (the passive tree data poefire's PoB codes need) on Path of
# Building's newest tree version. A new league usually brings a new tree: when PoB adds it,
# this regenerates the file, runs the tests and commits to dev, which publishes a beta.
on:
  schedule:
    - cron: "17 9 * * 5" # Fridays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pob-tree
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the new tree data
      actions: write # to start the beta build (a commit made here doesn't trigger it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Regenerate from PoB's newest tree
        run: |
          uv run python scripts/update_pob_tree.py --latest
          uv run ruff format src/poefire/pob_tree.py
      - name: Changed?
        id: diff
        run: |
          if git diff --quiet src/poefire/pob_tree.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already on PoB's newest tree"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git diff src/poefire/pob_tree.py | head -40
          fi
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: uv run pytest
      - name: Commit to dev
        if: steps.diff.outputs.changed == 'true'
        run: |
          version=$(sed -n 's/^TREE_VERSION = "\(.*\)"/\1/p' src/poefire/pob_tree.py)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "PoB tree data: $version (from Path of Building)"
          git push origin HEAD:dev
      - name: Publish a beta with it
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref dev -f publish_beta=true
