name: README screenshots

# Takes the README's screenshots of the app on demo data, with the game's real item icons
# (from poe.ninja / GGG's CDN), and commits them to the branch. Runs when the screenshot
# scripts change on dev, or by hand from the Actions tab.
on:
  push:
    branches: [dev]
    paths:
      - scripts/demo_data.py
      - scripts/screenshots.js
      - scripts/overlay_preview.py
      - scripts/assets/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Demo data (with real icons from poe.ninja)
        run: uv run python scripts/demo_data.py "$RUNNER_TEMP/demo/poefire"
      - name: Start poefire on it
        run: |
          touch "$RUNNER_TEMP/demo/Client.txt"
          XDG_CONFIG_HOME="$RUNNER_TEMP/demo" POE_SESSID=demo-not-a-real-cookie \
            nohup uv run poefire --log "$RUNNER_TEMP/demo/Client.txt" ui --no-browser --port 8473 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8473/api/status >/dev/null && break; sleep 1; done
      - name: Install Playwright
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Screenshots
        run: |
          NODE_PATH="$PWD/tests/browser/node_modules" node scripts/screenshots.js http://127.0.0.1:8473 docs/images
          uv run python scripts/overlay_preview.py docs/images/overlay.png
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "README screenshots (with real item icons)"
          git push
